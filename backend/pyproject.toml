[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-world-search"
version = "0.1.0"
description = "Grid world pathfinding algorithms"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.13",
    "mypy>=1.17",
    "pandas",
    "seaborn"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Ruff: linting + formatting
[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort import ordering
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # Line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["grid_search"]

[tool.ruff.format]
quote-style = "double"

# Mypy: static type checking
[tool.mypy]
python_version = "3.14"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

# Pytest
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

# Coverage
[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]